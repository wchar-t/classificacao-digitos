<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MNIST / Lab — reconhecedor de dígitos</title>
<style>
  :root {
    --paper: #f0ece4;
    --paper-deep: #e4ddd1;
    --ink: #161616;
    --muted: #756f67;
    --line: #d0c8bb;
    --night: #151617;
    --night-soft: #202223;
    --white: #fffdf8;
    --cobalt: #2454d6;
    --orange: #f16b3a;
    --bar: #2454d6;
    --bar-bg: #e6e0d7;
  }
  * { box-sizing: border-box; }
  html { min-height: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(circle at 8% 12%, rgba(241, 107, 58, .12), transparent 22rem),
      radial-gradient(circle at 92% 84%, rgba(36, 84, 214, .11), transparent 27rem),
      var(--paper);
    color: var(--ink);
    font-family: "DM Sans", sans-serif;
    padding: 0 24px;
    overflow-x: hidden;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: .22;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.18'/%3E%3C/svg%3E");
    mix-blend-mode: multiply;
  }
  main {
    width: 100%;
    max-width: 1180px;
    margin: 0 auto;
    padding: 30px 0 44px;
    position: relative;
    z-index: 1;
  }
  .topline {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--ink);
    padding-bottom: 13px;
    font-family: "DM Mono", monospace;
    font-size: .68rem;
    letter-spacing: .12em;
    text-transform: uppercase;
  }
  .brand, .topline-meta {
    display: inline-flex;
    align-items: center;
    gap: 9px;
  }
  .brand { font-weight: 500; }
  .brand-symbol {
    width: 19px;
    height: 19px;
    display: grid;
    place-items: center;
    border: 1.5px solid var(--ink);
    border-radius: 50%;
    font-size: .7rem;
    line-height: 1;
  }
  .topline-meta { color: var(--muted); }
  .live-dot, .result-dot {
    width: 7px;
    height: 7px;
    background: var(--orange);
    border-radius: 50%;
    display: inline-block;
    box-shadow: 0 0 0 4px rgba(241, 107, 58, .13);
  }
  header {
    width: 100%;
    display: grid;
    grid-template-columns: minmax(0, 1.18fr) minmax(250px, .82fr);
    gap: 60px;
    align-items: end;
    padding: 74px 0 58px;
  }
  .overline, .section-label, .stage-label {
    margin: 0;
    color: var(--cobalt);
    font-family: "DM Mono", monospace;
    font-size: .69rem;
    letter-spacing: .13em;
    line-height: 1.4;
    text-transform: uppercase;
  }
  header h1 {
    max-width: 780px;
    margin: 15px 0 0;
    font-family: "DM Serif Display", Georgia, serif;
    font-size: clamp(4.25rem, 9vw, 8.1rem);
    font-weight: 400;
    letter-spacing: -.065em;
    line-height: .82;
  }
  header h1 em {
    color: var(--cobalt);
    font-style: italic;
  }
  .hero-aside {
    padding: 0 0 5px 24px;
    border-left: 1px solid var(--line);
  }
  .hero-aside p {
    max-width: 290px;
    margin: 0 0 23px;
    color: var(--muted);
    font-size: .94rem;
    line-height: 1.55;
  }
  .status {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    min-height: 34px;
    padding: 8px 12px 8px 10px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: rgba(255, 253, 248, .65);
    color: var(--ink);
    font-family: "DM Mono", monospace;
    font-size: .66rem;
    letter-spacing: .04em;
  }
  .status::before {
    content: "";
    width: 7px;
    height: 7px;
    background: var(--orange);
    border-radius: 50%;
  }
  .hero-metrics {
    display: flex;
    gap: 26px;
    margin-top: 26px;
  }
  .metric { display: flex; flex-direction: column; gap: 4px; }
  .metric span {
    color: var(--muted);
    font-family: "DM Mono", monospace;
    font-size: .61rem;
    letter-spacing: .1em;
  }
  .metric strong {
    font-size: .9rem;
    font-weight: 600;
  }
  .workspace {
    display: grid;
    grid-template-columns: minmax(0, 1.05fr) minmax(330px, .75fr);
    gap: 20px;
    align-items: stretch;
  }
  .stage {
    width: 100%;
    min-width: 0;
    background: var(--night);
    border: 1px solid var(--ink);
    border-radius: 24px;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 19px;
    box-shadow: 8px 8px 0 rgba(22, 22, 22, .1);
  }
  .stage-head, .stage-foot, .bars-head, .result-head, .result-foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .stage-head { color: #f7f4ed; }
  .stage-label { color: #a7b9ff; }
  .stage-title {
    margin: 6px 0 0;
    font-size: .96rem;
    font-weight: 500;
    letter-spacing: -.01em;
  }
  .mode-tag, .canvas-caption, .bars-total, .result-foot {
    font-family: "DM Mono", monospace;
    font-size: .62rem;
    letter-spacing: .06em;
    text-transform: uppercase;
  }
  .mode-tag {
    border: 1px solid #444748;
    border-radius: 999px;
    padding: 6px 9px;
    color: #a9aca8;
  }
  .canvas-frame {
    width: 100%;
    position: relative;
    aspect-ratio: 1;
    overflow: hidden;
    border: 1px solid #3d4041;
    border-radius: 15px;
    background: #0c0d0e;
  }
  .canvas-frame::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    opacity: .13;
    background-image:
      linear-gradient(rgba(255,255,255,.32) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.32) 1px, transparent 1px);
    background-size: 14.285% 14.285%;
  }
  .canvas-caption {
    position: absolute;
    right: 12px;
    bottom: 10px;
    z-index: 3;
    color: #858987;
  }
  canvas {
    position: relative;
    z-index: 1;
    width: 100%;
    height: 100%;
    aspect-ratio: 1 / 1;
    touch-action: none;
    cursor: crosshair;
    display: block;
  }
  .stage-foot {
    gap: 14px;
    align-items: end;
  }
  .toolbar {
    display: flex;
    gap: 9px;
  }
  button {
    appearance: none;
    border: 1px solid #494c4c;
    border-radius: 999px;
    padding: 10px 17px;
    background: transparent;
    color: #f7f4ed;
    font-family: "DM Sans", sans-serif;
    font-size: .82rem;
    font-weight: 600;
    cursor: pointer;
    transition: transform .2s ease, background .2s ease, border-color .2s ease;
  }
  button:hover:not(:disabled) { transform: translateY(-2px); background: #2b2e2f; border-color: #727675; }
  button:focus-visible { outline: 3px solid #a7b9ff; outline-offset: 3px; }
  button:disabled { opacity: .42; cursor: not-allowed; }
  button.primary { background: var(--cobalt); border-color: var(--cobalt); color: white; }
  button.primary:hover:not(:disabled) { background: #3766e4; border-color: #3766e4; }
  .control-help {
    max-width: 195px;
    color: #8d918e;
    font-size: .72rem;
    line-height: 1.4;
    text-align: right;
  }
  .insights {
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .result {
    width: 100%;
    min-height: 308px;
    padding: 24px 26px 20px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    background: var(--white);
    border: 1px solid var(--ink);
    border-radius: 24px;
    box-shadow: 8px 8px 0 var(--paper-deep);
  }
  .result-head {
    width: 100%;
    color: var(--muted);
    font-family: "DM Mono", monospace;
    font-size: .65rem;
    letter-spacing: .1em;
    text-transform: uppercase;
  }
  .result-dot { background: var(--cobalt); box-shadow: 0 0 0 4px rgba(36, 84, 214, .12); }
  .result-label {
    margin-bottom: 5px;
    color: var(--muted);
    font-size: .75rem;
  }
  .result-number {
    display: flex;
    align-items: flex-end;
    gap: 17px;
  }
  .digit {
    margin-left: -6px;
    color: var(--cobalt);
    font-family: "DM Serif Display", Georgia, serif;
    font-size: clamp(8rem, 15vw, 13.4rem);
    font-weight: 400;
    letter-spacing: -.08em;
    line-height: .75;
    font-variant-numeric: tabular-nums;
  }
  .digit.muted { color: #c8c1b8; }
  .conf {
    color: var(--muted);
    padding-bottom: 7px;
    font-family: "DM Mono", monospace;
    font-size: .76rem;
    font-variant-numeric: tabular-nums;
  }
  .bars {
    width: 100%;
    flex: 1;
    padding: 20px 22px 22px;
    background: rgba(255, 253, 248, .68);
    border: 1px solid var(--line);
    border-radius: 24px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .bars-head { align-items: end; }
  .bars h2 {
    margin: 5px 0 0;
    font-size: 1.05rem;
    font-weight: 600;
    letter-spacing: -.02em;
  }
  .bars-total { color: var(--muted); }
  .bar-list {
    display: flex;
    flex-direction: column;
    gap: 7px;
  }
  .bar-row {
    display: grid;
    grid-template-columns: 15px 1fr 47px;
    align-items: center;
    gap: 9px;
    min-height: 16px;
    font-family: "DM Mono", monospace;
    font-size: .69rem;
  }
  .bar-row .d {
    color: var(--muted);
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .track {
    background: var(--bar-bg);
    border-radius: 999px;
    height: 7px;
    overflow: hidden;
  }
  .fill {
    height: 100%;
    background: var(--bar);
    width: 0%;
    border-radius: inherit;
    transition: width .35s cubic-bezier(.2,.8,.2,1);
  }
  .bar-row.top .d { color: var(--ink); font-weight: 500; }
  .bar-row.top .fill { background: var(--orange); }
  .pct {
    color: var(--muted);
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .bar-row.top .pct { color: var(--ink); }
  .result-foot {
    width: 100%;
    padding-top: 15px;
    border-top: 1px solid var(--line);
    color: var(--muted);
  }
  footer {
    display: flex;
    justify-content: space-between;
    gap: 20px;
    padding-top: 25px;
    color: var(--muted);
    font-family: "DM Mono", monospace;
    font-size: .62rem;
    letter-spacing: .06em;
    text-transform: uppercase;
  }
  footer span:last-child { color: var(--ink); }
  @media (max-width: 790px) {
    body { padding: 0 17px; }
    main { padding-top: 20px; }
    .topline-meta { display: none; }
    header {
      display: block;
      padding: 62px 0 42px;
    }
    header h1 { font-size: clamp(4rem, 18vw, 7rem); }
    .hero-aside {
      margin-top: 38px;
      padding: 0 0 0 17px;
    }
    .workspace { grid-template-columns: 1fr; }
    .result { min-height: 290px; }
  }
  @media (max-width: 460px) {
    .stage { padding: 16px; border-radius: 19px; }
    .stage-foot { align-items: start; flex-direction: column; }
    .control-help { max-width: none; text-align: left; }
    .result, .bars { border-radius: 19px; }
    .result { padding: 20px; }
    .bars { padding: 18px 17px; }
    footer { flex-direction: column; gap: 8px; }
  }

<body>
<main>
  <header style="display: none;">
    <div class="app-heading">
      <h1>Reconhecedor de dígitos</h1>
      <span class="app-meta">MNIST · desenho manual</span>
    </div>
  </header>

  <div class="workspace">
    <section class="stage">
      <div class="stage-head">
        <div>
          <p class="stage-label">Desenho</p>
          <p class="stage-title">Escreva um dígito no quadro</p>
        </div>
      </div>
      <div class="canvas-frame">
        <canvas id="canvas" aria-label="Área para desenhar um dígito de 0 a 9"></canvas>
      </div>
      <div class="stage-foot">
        <div class="toolbar">
          <button id="predictBtn" class="primary" disabled>Prever</button>
          <button id="clearBtn">Limpar</button>
        </div>
      </div>
    </section>

    <div class="insights">
      <section class="result">
        <div class="result-head"><span>Previsão</span></div>
        <div>
          <div class="result-label">O dígito mais provável</div>
          <div class="result-number">
            <div class="digit muted" id="prediction">–</div>
            <div class="conf" id="confidence"></div>
          </div>
        </div>
      </section>

      <section class="bars" id="bars">
        <div class="bars-head">
          <div><p class="section-label">Probabilidades</p><h2>Confiança por classe</h2></div>
          <span class="bars-total">0 a 9</span>
        </div>
        <div class="bar-list" id="barList"></div>
      </section>
    </div>
  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
<script>
(() => {
  const CSS_SIZE = 280;
  const BRUSH = 18;
  const MODEL_PATH = "modelo_web/model.json";

  const canvas = document.getElementById("canvas");
  canvas.width = CSS_SIZE;
  canvas.height = CSS_SIZE;
  const ctx = canvas.getContext("2d");
  const predEl = document.getElementById("prediction");
  const confEl = document.getElementById("confidence");
  const barListEl = document.getElementById("barList");
  const predictBtn = document.getElementById("predictBtn");
  const clearBtn = document.getElementById("clearBtn");

  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, CSS_SIZE, CSS_SIZE);

  const digitBars = [];
  for (let d = 0; d < 10; d++) {
    const row = document.createElement("div");
    row.className = "bar-row";
    row.innerHTML = `
      <span class="d">${d}</span>
      <div class="track"><div class="fill"></div></div>
      <span class="pct">0.0%</span>
    `;
    barListEl.appendChild(row);
    digitBars.push({
      row,
      fill: row.querySelector(".fill"),
      pct: row.querySelector(".pct"),
    });
  }

  let modelo = null;
  let desenhando = false;
  let ultimoX = 0, ultimoY = 0;
  let previsaoTimer = null;

  function limpaCanvas() {
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, CSS_SIZE, CSS_SIZE);
    predEl.textContent = "–";
    predEl.classList.add("muted");
    confEl.textContent = "";
    for (const b of digitBars) {
      b.fill.style.width = "0%";
      b.pct.textContent = "0.0%";
      b.row.classList.remove("top");
    }
  }

  function posicao(e) {
    const r = canvas.getBoundingClientRect();
    const sx = CSS_SIZE / r.width;
    const sy = CSS_SIZE / r.height;
    const src = e.touches ? e.touches[0] : e;
    return {
      x: (src.clientX - r.left) * sx,
      y: (src.clientY - r.top) * sy,
    };
  }

  function comeca(e) {
    e.preventDefault();
    desenhando = true;
    const p = posicao(e);
    ultimoX = p.x; ultimoY = p.y;
    ctx.strokeStyle = "#fff";
    ctx.lineWidth = BRUSH;
    ctx.beginPath();
    ctx.moveTo(ultimoX, ultimoY);
    ctx.lineTo(ultimoX + 0.01, ultimoY + 0.01);
    ctx.stroke();
  }

  function desenha(e) {
    if (!desenhando) return;
    e.preventDefault();
    const p = posicao(e);
    ctx.beginPath();
    ctx.moveTo(ultimoX, ultimoY);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    ultimoX = p.x; ultimoY = p.y;
  }

  function termina() {
    if (!desenhando) return;
    desenhando = false;
    if (previsaoTimer) clearTimeout(previsaoTimer);
    previsaoTimer = setTimeout(prever, 200);
  }

  canvas.addEventListener("mousedown", comeca);
  canvas.addEventListener("mousemove", desenha);
  window.addEventListener("mouseup", termina);
  canvas.addEventListener("mouseleave", () => { if (desenhando) termina(); });
  canvas.addEventListener("touchstart", comeca, { passive: false });
  canvas.addEventListener("touchmove", desenha, { passive: false });
  canvas.addEventListener("touchend", termina);
  canvas.addEventListener("touchcancel", termina);

  clearBtn.addEventListener("click", limpaCanvas);
  predictBtn.addEventListener("click", prever);

  async function carregar() {
    try {
      modelo = await tf.loadLayersModel(MODEL_PATH);
      predictBtn.disabled = false;
    } catch (err) {
      console.error(err);
    }
  }

  function canvasTemTinta() {
    const data = ctx.getImageData(0, 0, CSS_SIZE, CSS_SIZE).data;
    for (let i = 0; i < data.length; i += 4) {
      if (data[i] > 10) return true;
    }
    return false;
  }

  function prever() {
    if (!modelo) return;
    if (!canvasTemTinta()) {
      predEl.textContent = "–";
      predEl.classList.add("muted");
      confEl.textContent = "desenhe algo";
      return;
    }
    const t = tf.browser.fromPixels(canvas, 1)
      .resizeBilinear([28, 28])
      .toFloat()
      .div(255.0)
      .expandDims(0);
    const p = modelo.predict(t);
    const probs = p.dataSync();
    t.dispose();
    p.dispose();

    let top = 0;
    for (let i = 1; i < 10; i++) if (probs[i] > probs[top]) top = i;

    predEl.textContent = String(top);
    predEl.classList.remove("muted");
    confEl.textContent = (probs[top] * 100).toFixed(1) + "%";

    for (let d = 0; d < 10; d++) {
      const v = probs[d] * 100;
      const b = digitBars[d];
      b.fill.style.width = v.toFixed(2) + "%";
      b.pct.textContent = v.toFixed(1) + "%";
      b.row.classList.toggle("top", d === top);
    }
  }

  carregar();
})();
</script>
